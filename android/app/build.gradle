plugins {
    id 'com.android.application'
}

android {
    namespace 'com.deckpad'
    compileSdk 33

    defaultConfig {
        applicationId "com.deckpad"
        minSdk 14
        targetSdk 28
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
